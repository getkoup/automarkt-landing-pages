[build]
  command = "node build.mjs"
  publish = "dist"

[build.processing.html]
  pretty_urls = false

# tintlab.getkoup.com serves this hub at /. Each location page is its own
# Netlify project, proxied under a path so visitors stay on one domain.
# Link with the trailing slash (/memorial/). Memorial and Galleria add a missing
# slash themselves; Jersey Village's page is left unchanged, so always use /jersey-village/.
[[redirects]]
  from = "/jersey-village/*"
  to = "https://tint-lab-tint-199.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/memorial/*"
  to = "https://tint-lab-memorial-tint-199.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/galleria/*"
  to = "https://tint-lab-galleria-tint-199.netlify.app/:splat"
  status = 200
  force = true
