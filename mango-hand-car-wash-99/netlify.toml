[build]
  command = "node build.mjs"
  publish = "dist"

[build.processing.html]
  pretty_urls = false

# $29 detail page lives in its own Netlify project.
[[redirects]]
  from = "/detail-29/*"
  to = "https://mango-hand-car-wash-detail-29.netlify.app/:splat"
  status = 200
  force = true

# $29 call-only special lives in its own Netlify project.
[[redirects]]
  from = "/interior-exterior-29/*"
  to = "https://mango-hand-car-wash-detail-29-call.netlify.app/:splat"
  status = 200
  force = true

# $199 Nano Ceramic Tint lives in its own Netlify project.
[[redirects]]
  from = "/tint-199/*"
  to = "https://mango-hand-car-wash-tint-199.netlify.app/:splat"
  status = 200
  force = true

# $399 Ceramic Coating lives in its own Netlify project.
[[redirects]]
  from = "/ceramic-coating-399/*"
  to = "https://mango-hand-car-wash-ceramic-coating-399.netlify.app/:splat"
  status = 200
  force = true

# $1,299 Full Front End PPF (Meta) lives in its own Netlify project.
[[redirects]]
  from = "/1299-ppf/*"
  to = "https://mango-hand-car-wash-ppf-1299.netlify.app/:splat"
  status = 200
  force = true
