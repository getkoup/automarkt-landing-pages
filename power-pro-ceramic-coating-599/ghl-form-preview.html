<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Power Pro — form design preview</title><link rel="stylesheet" href="ghl-form.css"><style>
body{padding:24px!important;background:#080c14!important}.preview-card{max-width:460px;margin:0 auto;padding:28px;background:#111926;border:1px solid #344053;border-top:3px solid #0057e1}.preview-note{max-width:460px;margin:18px auto 0;color:#bdc8d9;font:11px/1.7 Arial;text-align:center}.preview-country{position:absolute;top:17px;left:15px;font-size:17px;line-height:20px}.iti{position:relative}input{display:block}.fields-container{display:flex;flex-direction:column}.form-builder--item{border:1px solid transparent}.field-label{display:block}button{white-space:normal}form{margin:0}@media(max-width:480px){body{padding:0!important}.preview-card{padding:24px}.preview-note{padding:0 16px}}
</style></head><body><main class="preview-card"><!-- OPTIONAL: Add a GHL HTML element ABOVE native fields when using the form alone.

</div>
</main><p class="preview-note" role="status" id="preview-status">Design preview using local sample fields. No information is submitted or saved.</p><script>document.querySelector('form').addEventListener('submit',function(e){e.preventDefault();document.getElementById('preview-status').textContent='Preview only — nothing was sent. The live form uses GHL’s native submission.';});</script></body></html>
