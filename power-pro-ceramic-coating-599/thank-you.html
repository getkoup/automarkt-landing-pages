<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080c14">
  <title>Thank You | Power Pro Studios</title>
  <link rel="icon" href="assets/power-pro-logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks{min-height:calc(100svh - 96px);display:grid;place-items:center;padding-block:60px}
    .thanks-card{width:100%;max-width:640px;padding:48px;background:#111926;border:1px solid #344053;border-top:3px solid #0057e1;text-align:center}
    .thanks-check{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 26px;border:1px solid #79b2ff55;border-radius:50%;background:#0057e11a;color:#79b2ff}
    .thanks-check svg{width:30px;height:30px}
    .thanks h1{font-size:clamp(36px,5vw,56px);line-height:1.08;margin:0 0 24px}
    .thanks h1 span{color:#79b2ff}
    .thanks p{font-size:14px;line-height:1.85;margin-bottom:28px}
    .thanks-actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:22px}
    .thanks-actions .text-link{font-size:12px}
    @media(max-width:600px){.thanks{min-height:calc(100svh - 79px);padding-block:35px}.thanks-card{padding:32px 24px}.thanks p{font-size:13px}.thanks-actions{flex-direction:column;gap:20px}.thanks-actions .button{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <header class="site-header container">
    <a class="brand" href="index.html" aria-label="Back to the Power Pro offer"><img src="assets/power-pro-logo.png" alt="Power Pro Studios" width="218" height="80"></a>
    <a class="header-call" href="tel:+17206054910"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2C9 21 3 15 3 5a2 2 0 0 1 2-2Z"/></svg><span>(720) 605-4910</span></a>
  </header>
  <main class="thanks container">
    <div class="thanks-card">
      <div class="thanks-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div>
      <span class="eyebrow">REQUEST RECEIVED</span>
      <h1>Thank you.<br><span>Your shine is next.</span></h1>
      <p>We’ve received your request for the $599 10-year ceramic coating. The Power Pro team will contact you to discuss your vehicle, package details, and availability.</p>
      <div class="thanks-actions"><a class="button" href="tel:+17206054910">Call (720) 605-4910 <span aria-hidden="true">↗</span></a><a class="text-link" href="index.html">Back to the offer ↗</a></div>
    </div>
  </main>
</body>
</html>
